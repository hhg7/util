name             = Cn-Util
author           = David E. Condon <dec986@gmail.com>
license          = Perl_5
copyright_year   = 2025-present
copyright_holder = David E. Condon

[@Filter]
-bundle = @Basic
-remove = GatherDir
-remove = MakeMaker

[Git::GatherDir]
exclude_filename = Makefile.PL

; MakeMaker::Awesome rather than MakeMaker for the libscan below, which is what
; lets compile.sh build in the repository root, as ~/Scripts/stats does.  EUMM's
; directory scan (init_dirscan in ExtUtils::MM_Unix) lists every *.pm and *.pl
; in the root beside lib/Cn/Util.pm, so `make install` there copied the shim
; Util.pm, old.util.pm, md2pod.pl, x.pl, list.pl and security.policy.pl into
; site_perl, and on perl-5.44.0 replaced the Util.pm symlink with a copy whose
; abs_path() no longer leads back to lib/.  The scan passes each root-level
; name through libscan, the documented hook for rejecting one, so root-level
; *.pm and *.pl are dropped; anything with a directory in its path falls
; through to the default.  [PruneFiles] keeps all of them out of the tarball,
; so there the hook rejects nothing.
[MakeMaker::Awesome]
eumm_version = 6.58
header = {
header =     package MY;
header =     sub libscan {
header =         my ($self, $path) = @_;
header =         return '' if $path =~ /\.p[ml]\z/ && $path !~ m{[/\\]};
header =         return $self->SUPER::libscan($path);
header =     }
header = }
; The same scan builds, tests and installs every subdirectory that holds a
; Makefile.PL, and dzil.sh leaves the last release's Cn-Util-$VERSION/ in the
; root: the first compile.sh run also built and installed Util-Cn-0.021/.  The
; module is all in lib/, so there is nothing to recurse into.
WriteMakefile_arg = DIR => []

; A whitelist, not a blacklist: anything not named here is pruned from the
; tarball.  That keeps out the root Util.pm (the compatibility shim for scripts
; that still say "use Util"; see its header), old.util.pm, and every author
; script.  SECURITY.md has to be listed or it is in git and absent from the
; distribution, which is the one place CPANSec's policy and the CPANTS
; "has_security_doc" metric look for it.
[PruneFiles]
match = ^(?!lib/|t/|README(\.md)?$|CONTRIBUTING\.md$|SECURITY\.md$|Changes$|Makefile\.PL$|META\.(yml|json)$|LICENSE$|MANIFEST$).

[VersionFromModule]
[MetaJSON]

; CPANTS "meta_yml_has_provides": META.yml and META.json name the modules the
; distribution installs, so that a tool can tell what indexing this tarball
; claims without unpacking it.  @Basic's MetaYAML/MetaJSON only write the
; metadata other plugins hand them, so without this neither has a "provides".
[MetaProvides::Package]

; Everything lib/Cn/Util.pm loads, and nothing else: installing the module
; should not drag in the suite's dependencies.  Most of these are require'd
; inside the sub that needs them rather than at "use" time (see the module's
; header), but every one is reachable from an exported sub, so every one is a
; runtime prerequisite.
;
; perl 5.010001 rather than 5.010: autodie, which import() hands to every
; caller, is core from 5.10.1 onward.
;
; Parallel::ForkManager 1.12 is the release that allowed true blocking waits
; (RT#102305), which is what set_waitpid_blocking_sleep(0) in _dir_parallel()
; asks for.  Term::ANSIColor 3.00 is the first with the "bright_" colours
; structure() uses (its own POD, "Compatibility"); perl 5.10.1 ships 2.00, so
; the minimum is needed there.  DDP is Data::Printer's short name and comes in
; the same distribution; show_dualvar, which _load_ddp() passes, is a 1.0
; option.
[Prereqs]
perl                  = 5.010001
autodie               = 0
Capture::Tiny         = 0
Data::Printer         = 1.000
Devel::Confess        = 0
Exporter              = 0
File::Find            = 0
File::Spec            = 0
JSON::MaybeXS         = 0
Parallel::ForkManager = 1.12
Scalar::Util          = 0
Term::ANSIColor       = 3.00

; Used by t/ and by nothing in lib/.  Test::More, File::Temp and File::Spec are
; core and Test::Exception is not; all are named because a smoker installs test
; prerequisites, so this is where the suite says what it needs, and an
; installer that is not testing does not have to have them.  Test::More 0.88 is
; the first with done_testing().
[Prereqs / TestRequires]
File::Spec            = 0
File::Temp            = 0
Test::Exception       = 0
Test::More            = 0.88

[MetaResources]
repository.web = https://github.com/hhg7/util
repository.url = git://github.com/hhg7/util
repository.type = git
bugtracker.web = https://github.com/hhg7/util/issues
homepage = https://metacpan.org/dist/Cn-Util
